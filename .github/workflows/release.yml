name: Release
permissions:
  contents: write
  id-token: write
on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Prerelease'
        required: true
        default: false
        type: boolean
      draft:
        description: 'Draft'
        required: true
        default: false
        type: boolean
      version-increment-type:
        description: 'Which part of the version to increment:'
        required: true
        type: choice
        options:
          - major
          - minor
          - patch
        default: 'patch'

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.AUTOMATION_USER_TOKEN }}
          fetch-depth: 0

      - name: Enable Corepack
        run: corepack enable

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'yarn'

      - name: Set Secrets
        uses: DevCycleHQ/aws-secrets-action@dbb92294a91b4acedb9aa9f69fabd2a849b8f79e # main
        with:
          secrets_map: '{"VSCODE_MARKETPLACE_TOKEN":"DEVCYCLE_GITHUB_vscode-extension_VSCODE_MARKETPLACE_TOKEN"}'
          aws_account_id: '134377926370'

      - uses: DevCycleHQ/release-action/prepare-release@a9e66801e2b8838e2548d8c24e1d76a109323238 # v2.4.0
        id: prepare-release
        with:
          github-token: ${{ secrets.AUTOMATION_USER_TOKEN }}
          prerelease: ${{ github.event.inputs.prerelease }}
          draft: ${{ github.event.inputs.draft }}
          version-increment-type: ${{ github.event.inputs.version-increment-type }}

      - name: Yarn Install
        run: yarn --immutable

      - name: Update version in code
        env:
          VERSION_INCREMENT_TYPE: ${{ github.event.inputs.version-increment-type }}
        run: yarn version "$VERSION_INCREMENT_TYPE"

      - name: Update Changelog
        env:
          CHANGELOG: ${{ steps.prepare-release.outputs.changelog }}
        run: printf '%s\n' "$CHANGELOG" > CHANGELOG.md

      - name: Commit version change
        env:
          RELEASE_TAG: ${{ steps.prepare-release.outputs.next-release-tag }}
        run: |
          git config --global user.email "foundation-admin@devcycle.com"
          git config --global user.name "DevCycle Automation"
          git add ./package.json ./CHANGELOG.md
          git commit -m "Release $RELEASE_TAG"

      - name: Fill in Rudderstack Key
        env:
          RUDDERSTACK_KEY: ${{ secrets.RUDDERSTACK_KEY }}
        run: |
          touch src/analytics.ts
          printf "export const RUDDERSTACK_KEY = '%s'\n" "$RUDDERSTACK_KEY" >> src/analytics.ts

      - name: Package VSCode Extension
        run: yarn run package

      - name: Publish VSCode Extension
        env:
          VSCE_PAT: ${{ env.VSCODE_MARKETPLACE_TOKEN }}
        run: yarn run publish

      - name: Push version change
        run: |
          git push origin HEAD:main
        if: inputs.draft != true

      - uses: DevCycleHQ/release-action/create-release@a9e66801e2b8838e2548d8c24e1d76a109323238 # v2.4.0
        id: create-release
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.prepare-release.outputs.next-release-tag }}
          target: main
          prerelease: ${{ github.event.inputs.prerelease }}
          draft: ${{ github.event.inputs.draft }}
          changelog: ${{ steps.prepare-release.outputs.changelog }}

      - name: Display link to release
        run: |
          echo "::notice title=Release ID::${{ steps.create-release.outputs.release-id }}"
          echo "::notice title=Release URL::${{ steps.create-release.outputs.release-url }}"

      - name: Update Docs
        uses: ./.github/actions/updateDocs
        with:
          latest_tag: ${{ steps.prepare-release.outputs.next-release-tag }}
          access_token: ${{ secrets.AUTOMATION_USER_TOKEN }}
