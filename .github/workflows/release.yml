name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Uses GITHUB_TOKEN, so CI does not run on the release PR by itself.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release

  publish:
    name: Publish
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Enable Corepack
        run: corepack enable

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'yarn'

      - name: Set Secrets
        uses: DevCycleHQ/aws-secrets-action@dbb92294a91b4acedb9aa9f69fabd2a849b8f79e # main
        with:
          secrets_map: '{"VSCODE_MARKETPLACE_TOKEN":"DEVCYCLE_GITHUB_vscode-extension_VSCODE_MARKETPLACE_TOKEN"}'
          aws_account_id: '134377926370'

      - name: Yarn Install
        run: yarn --immutable

      - name: Fill in Rudderstack Key
        env:
          RUDDERSTACK_KEY: ${{ secrets.RUDDERSTACK_KEY }}
        run: |
          touch src/analytics.ts
          printf "export const RUDDERSTACK_KEY = '%s'\n" "$RUDDERSTACK_KEY" >> src/analytics.ts

      - name: Package VSCode Extension
        run: yarn run package

      - name: Publish VSCode Extension
        env:
          VSCE_PAT: ${{ env.VSCODE_MARKETPLACE_TOKEN }}
        run: yarn run publish

      - name: Update Docs
        uses: ./.github/actions/updateDocs
        with:
          latest_tag: ${{ needs.release-please.outputs.tag_name }}
          access_token: ${{ secrets.AUTOMATION_USER_TOKEN }}
